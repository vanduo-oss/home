  <!--
    Structured data. This is how a crawler or LLM connects vanduo.dev to the
    GitHub org and the npm scope as one identity — the page's own prose can only
    imply it. Kept to facts that are verifiable from those three surfaces; no
    invented founding dates or people.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://vanduo.dev/#org",
        "name": "vanduo-oss",
        "alternateName": "Vanduo",
        "url": "https://vanduo.dev/",
        "logo": "https://vanduo.dev/og-image.png",
        "description": "Open-source foundation shipping a Vue 3 design system and lightweight web-AI components for search and on-device chat.",
        "sameAs": [
          "https://github.com/vanduo-oss",
          "https://www.npmjs.com/org/vanduo-oss"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://vanduo.dev/#website",
        "url": "https://vanduo.dev/",
        "name": "Vanduo",
        "inLanguage": "en",
        "publisher": { "@id": "https://vanduo.dev/#org" }
      },
      {
        "@type": "SoftwareSourceCode",
        "name": "@vanduo-oss/vd3",
        "description": "The Vanduo design system in one package: DTCG design tokens, the CSS tree, and typed Vd* Vue 3 components and composables. Sole peer dependency: vue.",
        "programmingLanguage": ["TypeScript", "Vue", "CSS"],
        "runtimePlatform": "Vue 3",
        "codeRepository": "https://github.com/vanduo-oss/vd3",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@id": "https://vanduo.dev/#org" },
        "isPartOf": { "@id": "https://vanduo.dev/#website" }
      },
      {
        "@type": "SoftwareSourceCode",
        "name": "@vanduo-oss/vd3-charts",
        "description": "SVG-first charts for the vd3 line (bar, line, area, scatter, donut, pie).",
        "programmingLanguage": ["TypeScript", "Vue"],
        "runtimePlatform": "Vue 3",
        "codeRepository": "https://github.com/vanduo-oss/vd3-charts",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@id": "https://vanduo.dev/#org" }
      },
      {
        "@type": "SoftwareSourceCode",
        "name": "@vanduo-oss/vd3-flowchart",
        "description": "SVG flowchart editor for the vd3 line.",
        "programmingLanguage": ["TypeScript", "Vue"],
        "runtimePlatform": "Vue 3",
        "codeRepository": "https://github.com/vanduo-oss/vd3-flowchart",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@id": "https://vanduo.dev/#org" }

      {
        "@type": "SoftwareSourceCode",

        "description": "Headless hybrid fuzzy + semantic search engine for documentation and curriculum corpora. Labs sibling repo (link:), not on npm. Hosts wire Fuse.js and Transformers.js.",
        "programmingLanguage": ["TypeScript", "JavaScript"],

        "author": { "@id": "https://vanduo.dev/#org" }

  <!--
    Apply a stored theme before first paint (avoids flash); no choice → follow the OS.

    The key is this site's prefixed vd3 key (injected at build from
    `VD3_THEME_PREFERENCE_KEY`): `vanduo-oss-theme-preference`, holding one of
    "system" | "dark" | "light" (vd3's THEME_MODES). This page dogfoods vd3
    after hydration, but the pre-paint script stays inline so the prerendered
    HTML applies the stored preference before Vue boots.
  -->
  <script>
    try {
      var t = localStorage.getItem('<!--VD3_THEME_PREFERENCE_KEY-->');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
