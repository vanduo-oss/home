<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanduo — vanduo open source software</title>
  <meta name="description" content="Vanduo is an open-source Vue 3 design system by vanduo-oss: typed Vd* components, a composable for every interaction, and DTCG design tokens in one package (@vanduo-oss/vd3). The earlier dual-engine Vanilla + Vue 3 line was retired in July 2026." />
  <link rel="canonical" href="https://vanduo.dev/" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Open Graph. og:image must be a raster: no major platform renders SVG previews. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vanduo" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Vanduo — vanduo open source software" />
  <meta property="og:description" content="Typed Vd* components, a composable for every interaction, and DTCG design tokens in one package. Open source, Vue 3 only." />
  <meta property="og:url" content="https://vanduo.dev/" />
  <meta property="og:image" content="https://vanduo.dev/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Vanduo — vanduo open source software" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Vanduo — vanduo open source software" />
  <meta name="twitter:description" content="Typed Vd* components, a composable for every interaction, and DTCG design tokens in one package. Open source, Vue 3 only." />
  <meta name="twitter:image" content="https://vanduo.dev/og-image.png" />

  <!--
    Structured data. This is how a crawler or LLM connects vanduo.dev to the
    GitHub org and the npm scope as one identity — the page's own prose can only
    imply it. Kept to facts that are verifiable from those three surfaces; no
    invented founding dates or people.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://vanduo.dev/#org",
        "name": "vanduo-oss",
        "alternateName": "Vanduo",
        "url": "https://vanduo.dev/",
        "logo": "https://vanduo.dev/og-image.png",
        "description": "Open-source foundation building Vanduo, a developer-focused Vue 3 design system.",
        "sameAs": [
          "https://github.com/vanduo-oss",
          "https://www.npmjs.com/org/vanduo-oss"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://vanduo.dev/#website",
        "url": "https://vanduo.dev/",
        "name": "Vanduo",
        "inLanguage": "en",
        "publisher": { "@id": "https://vanduo.dev/#org" }
      },
      {
        "@type": "SoftwareSourceCode",
        "name": "@vanduo-oss/vd3",
        "description": "The Vanduo design system in one package: DTCG design tokens, the CSS tree, and typed Vd* Vue 3 components and composables. Sole peer dependency: vue.",
        "programmingLanguage": ["TypeScript", "Vue", "CSS"],
        "runtimePlatform": "Vue 3",
        "codeRepository": "https://github.com/vanduo-oss/vd3",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@id": "https://vanduo.dev/#org" },
        "isPartOf": { "@id": "https://vanduo.dev/#website" }
      },
      {
        "@type": "SoftwareSourceCode",
        "name": "@vanduo-oss/vd3-cbun",
        "description": "Companion Vue 3 component bundle for Vanduo: charts, code editor, draw, flowchart, hex-grid and music-player as tree-shakeable subpath exports.",
        "programmingLanguage": ["TypeScript", "Vue"],
        "runtimePlatform": "Vue 3",
        "codeRepository": "https://github.com/vanduo-oss/vd3-cbun",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@id": "https://vanduo.dev/#org" }
      }
    ]
  }
  </script>

  <!--
    Apply a stored theme before first paint (avoids flash); no choice → follow the OS.

    The key is vd3's own: `vanduo-theme-preference`, holding one of
    "system" | "dark" | "light" (vd3's THEME_MODES). This page dogfoods vd3
    after hydration, but the pre-paint script stays inline so the prerendered
    HTML applies the stored preference before Vue boots.
  -->
  <script>
    try {
      var t = localStorage.getItem('vanduo-theme-preference');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
